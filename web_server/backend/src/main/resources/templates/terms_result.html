<!DOCTYPE HTML>
<html>
<head> 
    <title>Terms Search Result</title> 
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f3f3f3;
            font-family: Arial, sans-serif;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        .option-list {
            text-align: left;
        }
    </style>
</head>
<body>
    <div>
        <form action="/terms-result" id = "form" method="post">
            <h1>Terms Search Result</h1>
            <h2 th:text="${batchCount}"> batchCount: </h2> 
            <div th:each="term, iterStat : ${termsResult}">
                <textfield th:text="${term}"></textfield>
            </div>
        </form>
        <input type="hidden" name="input" form="form" th:value="${input}" />
        <input type="hidden" name="batchCount" form="form" th:value="${batchCount}" />
        <button th:if="${previous}!=-1" type="submit" form="form" name="action" value="Previous">Previous</button>
        <button th:if="${next}!=-1" type="submit" form="form" name="action" value="Next">Next</button>
    </div> 
</body>
