<!DOCTYPE HTML>
<html>
<head> 
    <title>Terms Search Result</title> 
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f3f3f3;
            font-family: Arial, sans-serif;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        .option-list {
            text-align: left;
        }
    </style>
</head>
<body>
    <div>
        <div th:each="term, iterStat : ${termsResult}">
            <textfield th:text="${term}"></textarea>
        </div>
    </div>  
</body>
